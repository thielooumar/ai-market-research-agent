[project]
name = "b2b-interview-strategist"
version = "0.1.0"
description = "B2B Target Scout & Interview Strategist Agent built with Google ADK and Gemini"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-adk",
    "google-genai",
    "a2ui-agent-sdk==0.4.0",
    "matplotlib>=3.8.0",
    "pydantic>=2.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = false
